name: Test Skills

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  test-python-skills:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ['3.8', '3.10', '3.12']
        skill: ['free-web-search', 'cloud-product-analysis', 'geo-tag-photos']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies for ${{ matrix.skill }}
      run: |
        cd ${{ matrix.skill }}
        pip install -r requirements.txt
        if grep -q playwright requirements.txt; then
          python -m playwright install chromium
        fi

    - name: Run tests
      run: |
        cd ${{ matrix.skill }}
        if [ -d "tests" ]; then
          pytest tests/ -v
        fi

    - name: Smoke test
      run: |
        cd ${{ matrix.skill }}
        python scripts/*.py --help

  test-node-skills:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        node-version: ['18', '20', '22']
        skill: ['free-web-search-js', 'smart-web-search']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install dependencies for ${{ matrix.skill }}
      run: |
        cd ${{ matrix.skill }}
        npm install
        npx playwright install chromium

    - name: Run tests
      run: |
        cd ${{ matrix.skill }}
        if [ -f "tests/test.sh" ]; then
          bash tests/test.sh
        fi

    - name: Smoke test
      run: |
        cd ${{ matrix.skill }}
        node scripts/search.js --help

  validate-markdown-skills:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Validate SKILL.md frontmatter
      run: |
        pip install pyyaml
        for skill in prompt-optimizer-cn free-finance-analysis hardworker ppt-ai-flavor-remover; do
          python -c "import yaml,sys; c=open('$skill/SKILL.md',encoding='utf-8').read(); p=c.split('---'); assert len(p)>=3, 'missing frontmatter'; m=yaml.safe_load(p[1]); assert 'name' in m and 'description' in m, 'missing required fields'; print('OK $skill')"
        done

    - name: Check LICENSE files
      run: |
        for skill in */; do
          [ -f "$skill/SKILL.md" ] || continue
          if [ ! -f "$skill/LICENSE" ]; then
            echo "ERROR: $skill missing LICENSE"
            exit 1
          fi
        done
        echo "✓ All skills have LICENSE"
